<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="160 80" stroke-linecap="round"/>
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="40 20"/>
  
  <!-- Core Glow -->
  <circle cx="256" cy="256" r="64" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Central Diamond / Prism -->
  <polygon points="256,160 320,256 256,352 192,256" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Inner Core Accent -->
  <polygon points="256,200 296,256 256,312 216,256" fill="#f0f9ff"/>
</svg>
